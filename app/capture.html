<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Treasure Hunt</title>
<!-- Every input is 16px so iOS never auto-zooms into a text box. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Palette carried over from architect-order. Portland stone for the ground,
     cast iron for the ink, the oxide red of Roman tile courses for the accent.

     Three theme states, not two. An explicit choice stamps data-theme on the
     root; the default setting stamps nothing and only prefers-color-scheme
     separates light from dark. So the bare :root carries the whole light
     palette, the media query redefines tokens for the unstamped dark case, and
     the [data-theme] blocks let a deliberate choice win in either direction.
     Every component reads tokens, never a literal, or it renders one theme's
     text on the other theme's ground. The one literal is the camera's ground,
     which is black in both themes because the game letterboxes on black. */
  :root {
    --paper: #ECEBE7; --panel: #FAFAF8; --ink: #191B1C; --ink-soft: #5C6163;
    --line: #CFCFC8; --accent: #9E2B25; --accent-soft: #F0DEDB;
    --accent-ink: #FFFFFF;
    --good: #2F6B4F; --good-soft: #DCE9E2;
    --warn: #9E2B25; --warn-soft: #F0DEDB;
    --caution: #8A5A00;
    --key: #E0E0DA; --key-ink: #191B1C; --shadow: 0 1px 3px rgba(25,27,28,.13);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141617; --panel: #1D2022; --ink: #E8E7E3; --ink-soft: #9AA0A2;
      --line: #363B3D; --accent: #E08078; --accent-soft: #3A2220;
      --accent-ink: #141617;
      --good: #6FBF97; --good-soft: #1E3229;
      --warn: #E08078; --warn-soft: #3A2220;
      --caution: #D99A2B;
      --key: #2A2E30; --key-ink: #E8E7E3; --shadow: 0 1px 3px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --paper: #141617; --panel: #1D2022; --ink: #E8E7E3; --ink-soft: #9AA0A2;
    --line: #363B3D; --accent: #E08078; --accent-soft: #3A2220;
    --accent-ink: #141617;
    --good: #6FBF97; --good-soft: #1E3229;
    --warn: #E08078; --warn-soft: #3A2220;
    --caution: #D99A2B;
    --key: #2A2E30; --key-ink: #E8E7E3; --shadow: 0 1px 3px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; }
  /* One column, the height of the screen: the two boxes, the camera taking
     whatever is left, the shutter, the count and the fix line. Nothing
     scrolls, and nothing on the page is a word but the two placeholders and
     the fix line under the count, which says whether the next shot will
     carry a location; the rest is numbers, and the words are in the flash. */
  .screen { width: 100%; max-width: 560px; display: flex; flex-direction: column;
            height: 100dvh; padding: 8px 0 calc(12px + env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }
  .boxes { display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 10px; }
  .boxes input { width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 10px;
                 border: 1px solid var(--line); background: var(--panel); color: var(--ink);
                 font-family: inherit; }
  .boxes input::placeholder { color: var(--ink-soft); }
  .boxes input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* The live view, full-bleed, letterboxed the way the game letterboxes it:
     the stream at its own aspect on a black ground, never cropped. What the
     owner sees here is the framing the game will later look through. */
  #stage { position: relative; flex: 1; min-height: 0; width: 100%; background: #000; }
  #feed { position: absolute; inset: 0; width: 100%; height: 100%;
          object-fit: contain; background: #000; }

  /* The live reading: the scorer's own verdict on the frame as it stands, a
     few times a second — a bar across the top of the view, the number in the
     corner, coloured by the band the number is in. Literal colours, like the
     ground they sit on: this is the camera's black, in both themes. */
  #gauge { position: absolute; left: 0; right: 0; top: 0; height: 8px; z-index: 2;
           background: rgba(255,255,255,.18); }
  #gaugefill { height: 100%; width: 0; background: #C8322B;
               transition: width .2s linear, background-color .2s linear; }
  #gaugefill.warn { background: #D99A2B; }
  #gaugefill.good { background: #3FBF7F; }
  #gaugenum { position: absolute; right: 10px; top: 16px; z-index: 2; padding: 5px 10px;
              border-radius: 999px; background: rgba(0,0,0,.55); color: #fff;
              font-size: .9rem; font-variant-numeric: tabular-nums; }
  /* The stencil the shot would give, roughly: white lines, in the flash
     above its words, for as long as the flash is up, whether the shot was
     taken or not. In the flash rather than under it: the flash is a sheet
     over the whole screen, and the eye is on it. */
  #preview { height: 46vh; width: auto; max-width: 84vw; object-fit: contain;
             background: rgba(0,0,0,.35); border-radius: 8px; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 6px;
              padding: 12px 12px 0; }
  /* The fix the next shot will carry, or the fact that there is none. */
  #fix { font-size: .85rem; color: var(--ink-soft); min-height: 1.2em; line-height: 1.2; }
  /* A round shutter, a ring with a disc in it, so it needs no word. */
  #shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--ink);
             background: var(--panel); cursor: pointer; position: relative; flex: none;
             box-shadow: var(--shadow); }
  #shutter::after { content: ""; position: absolute; inset: 5px; border-radius: 50%;
                    background: var(--accent); }
  #shutter:active::after { inset: 8px; }
  #shutter:disabled { opacity: .45; cursor: default; }
  #count { font-size: .95rem; color: var(--ink-soft); font-variant-numeric: tabular-nums;
           min-height: 1.3em; line-height: 1.3; }

  /* The flash: the whole screen, green for a moment on a shot that went up,
     red with the reason for as long as it takes to read one. It takes no taps.
     Visibility goes with the opacity so a message that has faded is gone from
     the page, not merely see-through. */
  #flash { position: fixed; inset: 0; z-index: 9; pointer-events: none;
           display: flex; flex-direction: column; gap: 16px;
           align-items: center; justify-content: center; text-align: center;
           padding: 24px; font-size: 1.05rem; line-height: 1.45; font-weight: 600;
           overflow-wrap: anywhere; color: var(--accent-ink);
           visibility: hidden; opacity: 0;
           transition: opacity .45s ease, visibility 0s linear .45s; }
  #flash.show { visibility: visible; opacity: .92; transition: none; }
  #flash.good { background: var(--good); }
  #flash.bad { background: var(--warn); }
  #flash.warn { background: var(--caution); }
</style>
</head>
<body>
<div class="screen">
  <div class="boxes">
    <input id="hunt" type="text" placeholder="hunt" maxlength="40" autocapitalize="off"
           autocorrect="off" spellcheck="false" autocomplete="off" enterkeyhint="done">
    <input id="clue" type="text" placeholder="clue" maxlength="200" autocomplete="off"
           enterkeyhint="done">
  </div>
  <div id="stage">
    <video id="feed" autoplay playsinline muted></video>
    <div id="gauge" hidden><div id="gaugefill"></div></div>
    <div id="gaugenum" hidden></div>
  </div>
  <div class="controls">
    <button id="shutter" type="button" aria-label="Shutter"></button>
    <div id="count">0</div>
    <div id="fix">no location</div>
  </div>
</div>
<div id="flash"><canvas id="preview" hidden></canvas><div id="flashmsg"></div></div>
<!-- SUPABASE GOES HERE -->
<script src="lens.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SUPABASE = window.SUPABASE || null;   // null: no upload, the shot is downloaded instead
const HUNT_KEY = "treasure.capture.hunt";
const REQUEST_MS = 15000;                   // a request that has not answered by then is dead

/* ---- the slug ----
   Lower-cased, trimmed, nothing but [a-z0-9-], at most forty characters: the
   shape the captures table checks and the hunt file's id will have to be. It
   is cleaned as it is typed and remembered on the phone, so it is typed once
   per hunt and the table never sees a slug the build would refuse. */
function cleanSlug(s) {
  return String(s || "").toLowerCase().trim().replace(/[^a-z0-9-]/g, "").slice(0, 40);
}

/* ---- the tick ----
   One 50 ms vibration per tap, in the capture phase before the button's own
   handler runs, so it is inside the tap and never after an await. iPhone has
   no vibration API and no switch is stretched over the shutter here: the
   owner takes these pictures on whatever phone is to hand, and the flash says
   what happened. */
const TICK_MS = 50;
function haptic() {
  // 50 ms: a pulse under about 30 is beneath what many Android motors can
  // make at all.
  try { if (navigator.vibrate) navigator.vibrate(TICK_MS); } catch (err) {}
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest && ev.target.closest("button");
  if (!b || b.disabled) return;
  haptic();
}, true);

/* ---- the fix ----
   One watchPosition for as long as the page is open, cleared on pagehide
   because a watch left running is a battery spent. The last fix whose
   accuracy is a number is what travels with the photograph; the line under
   the count says what it is, and names one the build will ignore as poor.
   The build decides, with the same limit. */
let fixWatch = null;
let lastFix = null;      // { lat, lon, accuracy } or null before the first usable fix
function startFixWatch() {
  paintFix();
  if (fixWatch !== null || !navigator.geolocation) return;
  fixWatch = navigator.geolocation.watchPosition(
    (pos) => {
      const c = pos.coords;
      if (Number.isFinite(c.accuracy)) {
        lastFix = { lat: c.latitude, lon: c.longitude, accuracy: c.accuracy };
        paintFix();
      }
    },
    () => { paintFix(); },
    { enableHighAccuracy: true });
}
// The line under the count: what the next shot will carry. Six of the
// thirteen photographs of one walk went up with no fix at all, from a phone
// that had none to give, and nobody knew until the map had holes in it. A
// fix worse than the build's limit is named as poor: the build ignores it,
// so the stencil would have no marker either way.
const ACC_USELESS_M = 75;                   // from_captures.py's limit, repeated
function fixText() {
  if (!lastFix) return "no location";
  const m = Math.round(lastFix.accuracy);
  return lastFix.accuracy <= ACC_USELESS_M ? "\u00b1" + m + " m" : "poor fix (\u00b1" + m + " m)";
}
function paintFix() { $("fix").textContent = fixText(); }
function stopFixWatch() {
  if (fixWatch !== null && navigator.geolocation) navigator.geolocation.clearWatch(fixWatch);
  fixWatch = null;
}

/* ---- the camera ----
   Exactly the request the game makes, and nothing more: an aspectRatio or a
   size constraint changes the crop a phone hands over, and a photograph taken
   here has to have the crop the game will later look through. */
let stream = null;
let asking = false;      // a request in flight; a second tap must not start another
function stopStream() {
  if (stream) { for (const t of stream.getTracks()) t.stop(); stream = null; }
}
async function startCamera() {
  if (asking) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    flash(false, window.isSecureContext
      ? "This browser will not hand over the camera."
      : "The camera needs a secure page. Open this over https, not from a file.");
    return;
  }
  asking = true;
  stopStream();
  try {
    const got = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false });
    stream = got;
    $("feed").srcObject = got;
  } catch (err) {
    flash(false, err && err.name === "NotAllowedError"
      ? "The camera was refused." : "No camera here.");
  } finally { asking = false; }
}
// A camera asked for on load was asked for outside a tap, which some browsers
// refuse, so a tap on the black ground asks again from inside one. A stream
// whose tracks have ended, taken by another app say, is asked for again too.
function cameraGone() {
  return !stream || stream.getTracks().every((t) => t.readyState === "ended");
}

/* ---- the flash ----
   Green for a moment: the shot went up. Red with the reason: it did not, and
   the count did not move. */
// Green for a moment, red or amber for long enough to read what it says:
// a sentence of advice needs longer than a status.
function flash(level, msg) {
  const kind = level === true ? "good" : level === false ? "bad" : level;
  const f = $("flash");
  clearTimeout(flash._t);
  $("flashmsg").textContent = msg || "";
  f.className = "show " + kind;
  // Long enough to read: a sentence of advice needs longer than a status,
  // and a status with a preview above it stays as long as the preview.
  let hold = kind === "good" ? 600 : (msg && msg.length > 60 ? 6500 : 3000);
  if (!$("preview").hidden) hold = Math.max(hold, PREVIEW_MS);
  if (kind === "good" && msg && msg.length > 12) hold = Math.max(hold, 3000);
  flash._t = setTimeout(() => {
    f.className = "";
    // The words go once the fade has finished, so a message that has faded is
    // not on the page any more, and the preview with them.
    flash._t = setTimeout(() => { $("flashmsg").textContent = ""; $("preview").hidden = true; }, 500);
  }, hold);
}

/* ---- the verdict ----
   The photograph is judged before it goes anywhere, with the scorer's own
   arithmetic (lens.js's assess): its strongest edges as the stencil, the
   ring beside them, the score at the true alignment. Over the twenty-five
   photographs of three hunts that number predicts the attainable score the
   build measures to about 0.05, and the build refuses a stencil under 0.35.
   The build's number is not quite this one: the build cuts at 800 px on the
   long side and judges on the worse of two working frames, 320 and 240 px,
   while this is the frame at 320. Over the thirty-eight photographs of five
   hunts the build's attainable score on that worse frame is about
   1.3 × this number − 0.2, to 0.045 either way. So, in this page's numbers:
   under 0.42 (the build's floor of 0.35) the shot is refused here, with
   what to change; under 0.54 (the build's 0.5) it goes up with a warning
   that it may be left out or play badly — on the walks so far every stencil
   the build measured at 0.5 or more was matched by every player who tried
   it, and those it measured between 0.40 and 0.47 by three players in
   eight; and from 0.54 it is simply taken. The number travels with the row,
   so the two judgements can be compared on every hunt that follows.

   The same number is read off the live view a few times a second and shown,
   so the frame can be moved until it is green before the shutter is
   pressed: nearer, or with plainer ground behind the subject. */
const JUDGE_BLOCK = 0.42;
const JUDGE_GOOD = 0.54;
const GAUGE_FULL = 0.65;                    // the bar is full here; green begins at JUDGE_GOOD
const GAUGE_MS = 400;                       // between readings of the live view, at least
const GAUGE_SHARE = 4;                      // a reading costs at most this share of the time: ¼
const PREVIEW_MS = 2500;                    // the stencil preview stays at least this long
function band(score) { return score < JUDGE_BLOCK ? "bad" : score < JUDGE_GOOD ? "warn" : "good"; }
// One reading, then the next is booked for later: 400 ms on, or four times
// what this one cost on a phone that is slower than that, so the loop never
// takes more than a quarter of the main thread. Not while a shot is being
// taken, and nothing at all while the page is hidden or the camera gone.
let gaugeTimer = null;
function readFrame() {
  gaugeTimer = null;
  const t0 = performance.now();
  const v = $("feed");
  if (busy || document.hidden || cameraGone() || !(v.videoWidth > 0)
      || !window.Lens || !window.Lens.assess) { showGauge(null); }
  else showGauge(window.Lens.assess(v));
  const took = performance.now() - t0;
  gaugeTimer = setTimeout(readFrame, Math.max(GAUGE_MS, GAUGE_SHARE * took));
}
function showGauge(j) {
  $("gauge").hidden = !j;
  $("gaugenum").hidden = !j;
  if (!j) return;
  const fill = $("gaugefill");
  fill.style.width = (Math.min(1, j.score / GAUGE_FULL) * 100) + "%";
  fill.className = band(j.score);
  $("gaugenum").textContent = j.score.toFixed(2);
}
function startGauge() { if (gaugeTimer === null) gaugeTimer = setTimeout(readFrame, GAUGE_MS); }
// The shape the verdict scored, white lines in the flash above its words:
// roughly the stencil the build would cut from this shot, so what a player
// will be shown can be seen before the next one is framed. It stays as
// long as the flash does; flash() keeps the flash up at least PREVIEW_MS.
function showPreview(j) {
  const c = $("preview");
  if (!j || !j.mask) { c.hidden = true; return; }
  c.width = j.w; c.height = j.h;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(j.w, j.h);
  for (let i = 0; i < j.w * j.h; i++) {
    if (!j.mask[i]) continue;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = 255;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  c.hidden = false;
}
function advice(j) {
  if (j.off >= 0.20) {
    return "too much going on beside the edges. Find plain background behind the subject "
         + "(sky, a wall, open ground), or get closer so it fills the frame.";
  }
  if (j.sparse) {
    return "too little in the frame. Get closer, or pick a subject with bigger, plainer edges.";
  }
  return "the edges are faint. Pick a subject with strong, simple outlines, "
       + "and stand where they are against something plain.";
}

/* ---- the shot ----
   The video drawn onto a canvas of its own size, so the JPEG is the stream's
   whole frame at the stream's own resolution, then a JPEG at 0.92. */
function snap(video) {
  return new Promise((resolve, reject) => {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) { reject(new Error("No picture yet.")); return; }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(video, 0, 0, w, h);
    canvas.toBlob((blob) => {
      if (blob) resolve({ blob, canvas }); else reject(new Error("The picture could not be made."));
    }, "image/jpeg", 0.92);
  });
}
// Sixteen random hex characters: the path is public and nothing lists the
// bucket, so the name is the whole of what keeps a photograph unguessable.
function hex16() {
  const b = new Uint8Array(8);
  crypto.getRandomValues(b);
  return Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
}
// One request, with a timeout, that throws a sentence the flash can show:
// what it was, the status, and what the server said.
async function request(what, url, init) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), REQUEST_MS);
  try {
    let res;
    try {
      res = await fetch(url, Object.assign({}, init, { signal: ctl.signal }));
    } catch (err) {
      throw new Error(what + (err && err.name === "AbortError"
        ? " timed out" : ": " + (err && err.message ? err.message : String(err))));
    }
    if (!res.ok) {
      let text = "";
      try { text = await res.text(); } catch (err) {}
      throw new Error(what + " " + res.status + ": " + text);
    }
    return res;
  } finally { clearTimeout(timer); }
}
// The photograph goes to the bucket first and the row second, so a row never
// points at a picture that is not there. The row carries the slug, the clue,
// and where the phone was, so the session gets the hunt without the owner
// moving a file.
async function send(slug, blob, clue, judged) {
  const base = SUPABASE.url.replace(/\/$/, "");
  const path = slug + "/" + Date.now() + "-" + hex16() + ".jpg";
  const auth = { apikey: SUPABASE.anon_key, Authorization: "Bearer " + SUPABASE.anon_key };
  await request("upload", base + "/storage/v1/object/captures/" + path, {
    method: "POST",
    headers: Object.assign({ "Content-Type": "image/jpeg", "x-upsert": "false" }, auth),
    body: blob,
  });
  await request("row", base + "/rest/v1/captures", {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=minimal" }, auth),
    body: JSON.stringify({
      hunt: slug, path, clue: clue || null,
      lat: lastFix ? lastFix.lat : null,
      lon: lastFix ? lastFix.lon : null,
      accuracy: lastFix ? lastFix.accuracy : null,
      judged: judged ? judged.score : null,
    }),
  });
}
// Without Supabase the photograph goes to the phone instead, through a link
// the page taps for itself. The object URL lives long enough for the browser
// to start the download before it is let go.
function download(slug, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = slug + "-" + Date.now() + ".jpg";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

let busy = false;        // a shot in flight; the shutter is off until it lands
let shots = 0;
// The shutter stays live with the hunt box empty, so a tap on it can say
// what is missing rather than do nothing: a greyed button on a phone in the
// field reads as broken.
function refresh() {
  $("shutter").disabled = busy;
}
async function shoot() {
  const slug = cleanSlug($("hunt").value);
  if (busy) return;
  if (!slug) { flash(false, "Type the hunt's name in the box first."); return; }
  busy = true;
  refresh();
  try {
    const shot = await snap($("feed"));
    const clue = $("clue").value.trim().slice(0, 200);
    // Judged before it goes anywhere. A shot that cannot score is not taken,
    // and the flash says what to change; the count stays where it was.
    const judged = window.Lens && window.Lens.assess ? window.Lens.assess(shot.canvas) : null;
    showPreview(judged);
    const num = judged ? " " + judged.score.toFixed(2) : "";
    if (judged && judged.score < JUDGE_BLOCK) {
      flash(false, "Not this one" + num + ": " + advice(judged));
      return;
    }
    if (SUPABASE) await send(slug, shot.blob, clue, judged);
    else download(slug, shot.blob);
    shots += 1;
    $("count").textContent = String(shots);
    $("clue").value = "";
    const where = !lastFix ? " No location with it."
                : lastFix.accuracy > ACC_USELESS_M ? " Its fix is poor, so no location with it." : "";
    if (judged && judged.score < JUDGE_GOOD) {
      flash("warn", "Taken, but weak" + num + ": " + advice(judged) + " The build may leave it out." + where);
    } else {
      flash(true, "Saved" + num + "." + where);
    }
  } catch (err) {
    flash(false, err && err.message ? err.message : String(err));
  } finally {
    busy = false;
    refresh();
  }
}

(function init() {
  let saved = "";
  try { saved = localStorage.getItem(HUNT_KEY) || ""; } catch (err) {}
  $("hunt").value = cleanSlug(saved);
  refresh();
  $("hunt").addEventListener("input", () => {
    const clean = cleanSlug($("hunt").value);
    if (clean !== $("hunt").value) $("hunt").value = clean;
    try { localStorage.setItem(HUNT_KEY, clean); } catch (err) {}
    refresh();
  });
  $("shutter").onclick = () => shoot();
  $("feed").addEventListener("click", () => { if (cameraGone()) startCamera(); });
  // The camera is asked for first, so its prompt is the first one seen; the
  // watch starts on load too, not after the stream, because a fix takes a
  // while to settle and the first shot should have one.
  startCamera();
  startFixWatch();
  startGauge();
  window.addEventListener("pagehide", stopFixWatch);
  // A page brought back from the back-forward cache gets no load; the watch it
  // gave up on pagehide comes back here.
  window.addEventListener("pageshow", (ev) => { if (ev.persisted) startFixWatch(); });
})();
</script>
</body>
</html>
